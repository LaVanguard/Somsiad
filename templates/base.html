{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Somsiad - Twój doradca prawny{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- HTMX CSRF Token Configuration -->
    <script>
        // Get CSRF token from cookie (Django's default method)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Configure HTMX to send CSRF token with all requests
        document.addEventListener('DOMContentLoaded', function() {
            document.body.addEventListener('htmx:configRequest', function(event) {
                const csrfToken = getCookie('csrftoken');
                if (csrfToken) {
                    event.detail.headers['X-CSRFToken'] = csrfToken;
                }
            });
        });
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 50%, #f3f4f6 100%);
            color: #1F2937;
        }

        /* Custom gradient utilities */
        .bg-gradient-dark {
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
        }

        .bg-gradient-card {
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
        }

        .bg-gradient-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        /* 3D Button effects */
        .btn-3d {
            box-shadow:
                0 4px 14px 0 rgba(59, 130, 246, 0.39),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 20px rgba(59, 130, 246, 0.55),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
        }

        .btn-3d:active {
            transform: translateY(1px);
            box-shadow:
                0 2px 8px rgba(59, 130, 246, 0.3),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Card depth effect */
        .card-depth {
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .card-depth:hover {
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        /* Input depth */
        .input-depth {
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .input-depth:focus {
            box-shadow:
                inset 0 2px 4px rgba(0, 0, 0, 0.2),
                0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Pattern overlay */
        .pattern-dots {
            background-image: radial-gradient(circle at 1px 1px, rgba(0, 0, 0, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* Gradient animation */
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite;
        }

        /* Glow effects */
        .glow-blue {
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5));
        }

        .glow-green {
            filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.5));
        }

        /* Smooth transitions */
        .transition-all-smooth {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-image {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #374151;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="min-h-screen">
    {% block content %}{% endblock %}
</body>
</html>
