<!DOCTYPE html>
<html>
<head>
    <title>Law Advisor</title>
</head>
<body>
    <h1>Law Advisor 🏠⚖️</h1>
    
    {% if user.is_authenticated %}
        <p>Witaj, {{ user.email }}!</p>
        <a href="{% url 'account_logout' %}">Logout</a>
    {% else %}
        <p>Zaloguj się lub zarejestruj:</p>
        <a href="{% url 'account_login' %}">Login</a> | 
        <a href="{% url 'account_signup' %}">Sign Up</a>
    {% endif %}
</body>
</html>
