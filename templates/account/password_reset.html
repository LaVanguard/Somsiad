{% extends "base.html" %}
{% load static %}

{% block title %}Resetuj hasło - Sąsiad{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <!-- Logo & Brand -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="{% static 'images/logo.png' %}" alt="Sąsiad" class="w-20 h-20 object-contain">
            </div>
            <h1 class="text-3xl font-semibold text-gray-800 mb-2">Sąsiad</h1>
            <p class="text-gray-500 text-sm">Twój doradca prawny</p>
        </div>

        <!-- Password Reset Form -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
            <h2 class="text-xl font-medium text-gray-800 mb-2">Resetuj hasło</h2>
            <p class="text-sm text-gray-600 mb-6">Wprowadź swój adres email, a wyślemy Ci link do resetowania hasła.</p>

            <form method="post" action="{% url 'account_reset_password' %}">
                {% csrf_token %}

                <!-- Email Field -->
                <div class="mb-6">
                    <label for="id_email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-400 focus:border-transparent outline-none transition"
                        placeholder="twoj@email.com"
                    >
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2.5 rounded-lg transition duration-200"
                >
                    Wyślij link resetujący
                </button>

                <!-- Back to Login -->
                <div class="mt-6 pt-6 border-t border-gray-200 text-center">
                    <a href="{% url 'account_login' %}" class="text-sm text-gray-600 hover:text-gray-800 transition">
                        ← Powrót do logowania
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
