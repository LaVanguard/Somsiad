{% extends "base.html" %}
{% load static %}

{% block title %}Zaloguj się - Somsiad{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <!-- Logo & Brand -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="{% static 'images/logo.png' %}" alt="Somsiad" class="w-20 h-20 object-contain">
            </div>
            <h1 class="text-3xl font-semibold text-gray-800 mb-2">Somsiad</h1>
            <p class="text-gray-500 text-sm">Twój doradca prawny</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
            <h2 class="text-xl font-medium text-gray-800 mb-6">Zaloguj się</h2>

            <form method="post" action="{% url 'account_login' %}">
                {% csrf_token %}

                <!-- Email Field -->
                <div class="mb-4">
                    <label for="id_login" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        name="login"
                        id="id_login"
                        required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-400 focus:border-transparent outline-none transition"
                        placeholder="twoj@email.com"
                    >
                </div>

                <!-- Password Field -->
                <div class="mb-6">
                    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-2">
                        Hasło
                    </label>
                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-400 focus:border-transparent outline-none transition"
                        placeholder="••••••••"
                    >
                </div>

                <!-- Error Messages -->
                {% if form.errors %}
                <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                    <p class="text-sm text-red-600">Nieprawidłowy email lub hasło</p>
                </div>
                {% endif %}

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2.5 rounded-lg transition duration-200"
                >
                    Zaloguj się
                </button>

                <!-- Forgot Password Link -->
                <div class="mt-4 text-center">
                    <a href="{% url 'account_reset_password' %}" class="text-sm text-gray-600 hover:text-gray-800 transition">
                        Zapomniałeś hasła?
                    </a>
                </div>

                <!-- Note: Signup disabled (admin-only user creation) -->
            </form>
        </div>
    </div>
</div>
{% endblock %}
