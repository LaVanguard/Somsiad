<!-- Straż Miejska Call Modal -->
<div x-show="showStrazModal"
     x-cloak
     @keydown.escape.window="showStrazModal = false"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
     @click.self="showStrazModal = false">

    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[85vh] overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="flex items-center justify-between p-6 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800">🚔 Połączenie ze Strażą Miejską</h3>
            </div>
            <button @click="showStrazModal = false; endCall()" class="text-gray-400 hover:text-gray-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-6">
            <!-- Calling Animation -->
            <div x-show="!callConnected && !callEnded" class="text-center py-12">
                <div class="relative inline-block mb-6">
                    <div class="animate-bounce">
                        <svg class="w-24 h-24 text-green-600" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/>
                        </svg>
                    </div>
                    <div class="absolute inset-0 animate-ping opacity-25">
                        <svg class="w-24 h-24 text-green-400" fill="currentColor" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" />
                        </svg>
                    </div>
                </div>
                <p class="text-xl font-bold mb-2">Dzwonię...</p>
                <p class="text-gray-600">986 - Straż Miejska</p>
            </div>

            <!-- Call Connected -->
            <div x-show="callConnected && !callEnded" class="space-y-6">
                <!-- Operator Info -->
                <div class="flex items-center gap-4 bg-green-50 p-4 rounded-lg border border-green-200">
                    <div class="w-12 h-12 bg-green-600 rounded-full flex items-center justify-center shrink-0">
                        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-800">Dyżurny Straży Miejskiej</p>
                        <p class="text-sm text-gray-600">Połączenie aktywne</p>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-mono text-gray-700" x-text="callTimer"></p>
                        <div class="flex items-center gap-1 text-green-600">
                            <div class="w-2 h-2 bg-green-600 rounded-full animate-pulse"></div>
                            <span class="text-xs">Na linii</span>
                        </div>
                    </div>
                </div>

                <!-- Conversation Messages -->
                <div class="space-y-3 max-h-96 overflow-y-auto">
                    <template x-for="message in callMessages" :key="message.id">
                        <div class="flex" :class="message.sender === 'user' ? 'justify-end' : 'justify-start'">
                            <div class="max-w-sm px-4 py-3 rounded-2xl shadow-sm"
                                 :class="message.sender === 'user' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-gray-100 text-gray-800 rounded-bl-sm'">
                                <p class="text-sm" x-text="message.text"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Call Ended -->
            <div x-show="callEnded" class="text-center py-12">
                <div class="mb-6 text-7xl">✅</div>
                <h4 class="text-2xl font-bold text-green-600 mb-3">Patrol wysłany!</h4>
                <p class="text-gray-700 mb-2">Straż Miejska została powiadomiona.</p>
                <p class="text-gray-600 mb-4">
                    Czas przybycia: <strong>~15 minut</strong>
                </p>
                <p class="text-sm text-gray-500 mb-4">
                    Czas rozmowy: <span x-text="callTimer"></span>
                </p>
                <div class="inline-block bg-yellow-50 border-2 border-yellow-300 rounded-lg p-4 my-4">
                    <p class="text-lg font-semibold text-yellow-800">😄 To był żart!</p>
                    <p class="text-sm text-yellow-700 mt-1">Nie dzwoniliśmy naprawdę. To symulacja.</p>
                </div>
            </div>
        </div>

        <!-- Footer - Hang Up Button -->
        <div x-show="callConnected && !callEnded" class="p-6 border-t border-gray-200 bg-gray-50">
            <button @click="endCall()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg flex items-center justify-center gap-2 font-medium transition">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
                Rozłącz
            </button>
        </div>

        <div x-show="callEnded" class="p-6 border-t border-gray-200 bg-gray-50">
            <button @click="showStrazModal = false; resetStrazModal()" class="w-full px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition font-medium">
                Zamknij
            </button>
        </div>
    </div>
</div>
