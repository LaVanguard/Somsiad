<!-- Donos Modal -->
<div x-show="showDonosModal"
     x-cloak
     @keydown.escape.window="showDonosModal = false"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
     @click.self="showDonosModal = false">

    <div class="bg-white rounded-xl shadow-2xl max-w-3xl w-full max-h-[85vh] overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="flex items-center justify-between p-6 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800">📧 Anonimowy Donos do Gminy</h3>
            </div>
            <button @click="showDonosModal = false" class="text-gray-400 hover:text-gray-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-6">
            <!-- Loading State -->
            <div x-show="generatingDonos" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-orange-600 mb-4"></div>
                <p class="text-lg font-semibold text-gray-700">Generuję email-donos...</p>
                <p class="text-sm text-gray-500 mt-2">AI tworzy anonimową skargę</p>
            </div>

            <!-- Generated Email + File Upload -->
            <div x-show="!generatingDonos && !sendingDonos && !donosSent" class="space-y-6">
                <!-- Email Subject -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Temat:</label>
                    <input type="text" x-model="donosSubject"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500">
                </div>

                <!-- Email Body -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Treść emaila:</label>
                    <textarea x-model="donosBody" rows="12"
                              class="w-full px-4 py-3 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-orange-500"></textarea>
                </div>

                <!-- File Upload Zone -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Załączniki (dokumentacja):</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-orange-500 transition">
                        <input type="file" id="donos-files" multiple
                               accept="image/*,audio/*,video/*"
                               @change="handleDonosFiles($event)"
                               class="hidden">
                        <label for="donos-files" class="cursor-pointer">
                            <svg class="w-12 h-12 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            <p class="text-gray-600 mb-1">Przeciągnij pliki lub kliknij aby dodać</p>
                            <p class="text-xs text-gray-400">Zdjęcia, nagrania jako dowód (max 5 plików, 10MB każdy)</p>
                        </label>
                    </div>
                </div>

                <!-- File Preview List -->
                <div x-show="donosFiles.length > 0" class="space-y-2">
                    <template x-for="(file, index) in donosFiles" :key="index">
                        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl" x-text="getFileIcon(file.type)"></span>
                                <div>
                                    <p class="text-sm font-medium" x-text="file.name"></p>
                                    <p class="text-xs text-gray-500" x-text="formatFileSize(file.size)"></p>
                                </div>
                            </div>
                            <button @click="removeDonosFile(index)" class="text-red-500 hover:text-red-700">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Sending Animation -->
            <div x-show="sendingDonos" class="text-center py-12">
                <div class="space-y-6">
                    <p class="text-lg font-semibold text-gray-700" x-text="sendingDonosMessage"></p>
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div class="bg-orange-600 h-3 rounded-full transition-all duration-1000 ease-out"
                             :style="`width: ${sendingDonosProgress}%`"></div>
                    </div>
                </div>
            </div>

            <!-- Success Message -->
            <div x-show="donosSent" class="text-center py-12">
                <div class="mb-6 text-7xl animate-bounce">✅</div>
                <h4 class="text-2xl font-bold text-green-600 mb-3">Donos wysłany!</h4>
                <p class="text-gray-700 mb-4">Email przekazany do Urzędu Gminy.</p>
                <p class="text-gray-600 mb-2">
                    Załączników: <strong x-text="donosFiles.length"></strong>
                </p>
                <div class="inline-block bg-yellow-50 border-2 border-yellow-300 rounded-lg p-4 my-4">
                    <p class="text-lg font-semibold text-yellow-800">😄 To był żart!</p>
                    <p class="text-sm text-yellow-700 mt-1">Nic nie zostało wysłane naprawdę.</p>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div x-show="!generatingDonos && !sendingDonos && !donosSent" class="p-6 border-t border-gray-200 bg-gray-50">
            <div class="flex gap-3 justify-end">
                <button @click="showDonosModal = false" class="px-5 py-2.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 rounded-lg transition font-medium">
                    Anuluj
                </button>
                <button @click="sendDonosEmail()" class="px-5 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-lg transition font-medium flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                    Wyślij Donos
                </button>
            </div>
        </div>

        <div x-show="donosSent" class="p-6 border-t border-gray-200 bg-gray-50">
            <button @click="showDonosModal = false; resetDonosModal()" class="w-full px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition font-medium">
                Zamknij
            </button>
        </div>
    </div>
</div>
