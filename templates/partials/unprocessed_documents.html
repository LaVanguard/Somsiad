{% for doc in documents %}
<div class="px-3 py-2 bg-gray-700 rounded-lg group hover:bg-gray-600 transition">
    <div class="flex items-start justify-between gap-2">
        <div class="flex-1 min-w-0">
            <div class="text-sm truncate font-medium">{{ doc.title }}</div>
            <div class="text-xs text-gray-400 mt-1">
                <span class="inline-block px-2 py-0.5 bg-yellow-600 rounded text-xs">Oczekuje</span>
                <span class="ml-2">{{ doc.category }}</span>
            </div>
        </div>
        <div class="flex gap-1">
            <button
                hx-post="/api/documents/{{ doc.id }}/process/"
                hx-target="#document-status"
                hx-indicator="#processing-spinner-{{ doc.id }}"
                hx-on::before-request="document.getElementById('document-status').innerHTML = '<div class=\'text-blue-400 text-xs\'>[INFO] Przetwarzanie... To może potrwać 30-60 sekund.</div>'"
                class="px-3 py-1 text-xs bg-green-600 hover:bg-green-700 rounded transition flex items-center gap-1"
            >
                <span>Przetwórz</span>
                <svg id="processing-spinner-{{ doc.id }}" class="htmx-indicator animate-spin h-3 w-3 text-white" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
            <button
                hx-post="/api/documents/{{ doc.id }}/delete/"
                hx-target="#document-status"
                hx-confirm="Czy na pewno usunąć dokument '{{ doc.title }}'?"
                class="p-1.5 hover:bg-red-600 rounded transition"
                title="Usuń dokument"
            >
                <svg class="w-4 h-4 text-gray-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </div>
    </div>
</div>
{% empty %}
<div class="text-center py-8 text-gray-400 text-sm">
    Wszystko przetworzone!
</div>
{% endfor %}
