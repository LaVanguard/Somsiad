{% for doc in documents %}
<div class="px-3 py-2 bg-gray-700 rounded-lg group hover:bg-gray-600 transition">
    <div class="flex items-start justify-between gap-2">
        <div class="flex-1 min-w-0">
            <div class="text-sm truncate font-medium">{{ doc.title }}</div>
            <div class="text-xs text-gray-400 mt-1">
                <span class="inline-block px-2 py-0.5 bg-gray-600 rounded text-xs">{{ doc.category }}</span>
                <span class="ml-2">{{ doc.embeddings.count }} chunków</span>
            </div>
        </div>
        <div class="flex gap-1">
            <button
                hx-post="/api/documents/{{ doc.id }}/reprocess/"
                hx-target="#document-status"
                class="p-1.5 hover:bg-gray-500 rounded transition"
                title="Przetwórz ponownie"
            >
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>
    </div>
</div>
{% empty %}
<div class="text-center py-8 text-gray-400 text-sm">
    Brak przetworzonych dokumentów
</div>
{% endfor %}
