{% for doc in documents %}
<div class="px-3 py-2 bg-gray-700 rounded-lg group hover:bg-gray-600 transition">
    <div class="flex items-start justify-between gap-2">
        <div class="flex-1 min-w-0">
            <div class="text-sm truncate font-medium">{{ doc.title }}</div>
            <div class="text-xs text-gray-400 mt-1">
                <span class="inline-block px-2 py-0.5 bg-gray-600 rounded text-xs">{{ doc.category }}</span>
                <span class="ml-2">{{ doc.embeddings.count }} chunków</span>
            </div>
        </div>
        <div class="flex gap-1">
            <button
                hx-post="/api/documents/{{ doc.id }}/reprocess/"
                hx-target="#document-status"
                hx-indicator="#reprocess-spinner-{{ doc.id }}"
                hx-on::before-request="document.getElementById('document-status').innerHTML = '<div class=\'text-blue-400 text-xs\'>[INFO] Ponowne przetwarzanie...</div>'"
                class="p-1.5 hover:bg-gray-500 rounded transition"
                title="Przetwórz ponownie"
            >
                <svg id="reprocess-spinner-{{ doc.id }}" class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
            <button
                hx-post="/api/documents/{{ doc.id }}/delete/"
                hx-target="#document-status"
                hx-confirm="Czy na pewno usunąć dokument '{{ doc.title }}'? To usunie również wszystkie embeddingi ({{ doc.embeddings.count }} chunków)."
                class="p-1.5 hover:bg-red-600 rounded transition"
                title="Usuń dokument"
            >
                <svg class="w-4 h-4 text-gray-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </div>
    </div>
</div>
{% empty %}
<div class="text-center py-8 text-gray-400 text-sm">
    Brak przetworzonych dokumentów
</div>
{% endfor %}
