name: Django CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: 'test-secret-key-for-ci-only-not-secure'
        OPENAI_API_KEY: 'sk-test-mock-key-for-ci'
        SUPABASE_URL: 'https://mock.supabase.co'
        SUPABASE_KEY: 'mock-supabase-key-for-ci'

    - name: Run Django system checks
      run: |
        python manage.py check --deploy
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: 'test-secret-key-for-ci-only-not-secure'
        DEBUG: 'False'
        OPENAI_API_KEY: 'sk-test-mock-key-for-ci'
        SUPABASE_URL: 'https://mock.supabase.co'
        SUPABASE_KEY: 'mock-supabase-key-for-ci'

    - name: Check for missing migrations
      run: |
        python manage.py makemigrations --check --dry-run
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: 'test-secret-key-for-ci-only-not-secure'
        OPENAI_API_KEY: 'sk-test-mock-key-for-ci'
        SUPABASE_URL: 'https://mock.supabase.co'
        SUPABASE_KEY: 'mock-supabase-key-for-ci'

    - name: Run migrations
      run: |
        python manage.py migrate
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: 'test-secret-key-for-ci-only-not-secure'
        OPENAI_API_KEY: 'sk-test-mock-key-for-ci'
        SUPABASE_URL: 'https://mock.supabase.co'
        SUPABASE_KEY: 'mock-supabase-key-for-ci'

    - name: Run tests with coverage
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term --ignore=tests/e2e
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: 'test-secret-key-for-ci-only-not-secure'
        OPENAI_API_KEY: 'sk-test-mock-key-for-ci'
        SUPABASE_URL: 'https://mock.supabase.co'
        SUPABASE_KEY: 'mock-supabase-key-for-ci'

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 30

    - name: Check code coverage threshold
      run: |
        coverage report --fail-under=50
      continue-on-error: true
      env:
        OPENAI_API_KEY: 'sk-test-mock-key-for-ci'
        SUPABASE_URL: 'https://mock.supabase.co'
        SUPABASE_KEY: 'mock-supabase-key-for-ci'

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Check code formatting with black
      run: |
        black --check .
      continue-on-error: true

    - name: Check import sorting with isort
      run: |
        isort --check-only .
      continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security scan
      run: |
        bandit -r . -ll
      continue-on-error: true

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json
      continue-on-error: true

  build-summary:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()

    steps:
    - name: Build Summary
      run: |
        echo "### CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "❌ **Tests failed!** Check the test job for details." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
