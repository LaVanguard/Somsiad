[pytest]
# Pytest configuration for E2E tests with Playwright
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests/e2e
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --headed
    --browser chromium
    --slowmo 100

markers =
    e2e: End-to-end tests with Playwright
    slow: Slow running tests
